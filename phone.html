<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071d18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pathway">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">
<title>Pathway — phone preview</title>
<script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    if (params.get("frame") === "1") return;

    var standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
      || window.navigator.standalone === true;
    var touch = (window.navigator.maxTouchPoints || 0) > 0
      || (window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches);
    var narrow = window.matchMedia && window.matchMedia("(max-width: 520px)").matches;

    if (touch || standalone || narrow) {
      params.delete("frame");
      var target = new URL("./index.html", window.location.href);
      var query = params.toString();
      target.search = query ? "?" + query : "";
      target.hash = window.location.hash;
      window.location.replace(target.href);
    }
  })();
</script>
<style>
  :root {
    --preview-height: 100vh;
  }
  @supports (height: 100dvh) {
    :root {
      --preview-height: 100dvh;
    }
  }
  html, body {
    margin: 0;
    min-height: var(--preview-height);
    background: radial-gradient(120% 120% at 50% 0%, #123a30 0%, #0b2922 45%, #051a16 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #f1e6d4;
  }
  .stage {
    min-height: var(--preview-height);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 16px;
    box-sizing: border-box;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.18em;
    font-weight: 700;
    font-size: 12.5px;
    color: #e5cd9c;
  }
  /* Ramka 390×844 jest wyłącznie podglądem komputerowym. */
  .frame-slot {
    width: calc(410px * var(--s, 1));
    height: calc(864px * var(--s, 1));
  }
  .device {
    width: 410px;
    height: 864px;
    padding: 10px;
    border-radius: 44px;
    background: #0a0f0d;
    box-shadow:
      0 0 0 1px rgba(228, 207, 152, 0.22),
      0 30px 80px rgba(0, 0, 0, 0.55);
    box-sizing: border-box;
    transform: scale(var(--s, 1));
    transform-origin: top left;
  }
  .device iframe {
    width: 390px;
    height: 844px;
    border: 0;
    border-radius: 34px;
    background: #071d18;
    display: block;
  }
  .hint {
    margin: 0;
    font-size: 12.5px;
    opacity: 0.75;
    text-align: center;
  }
  .hint a {
    color: #e5cd9c;
  }
  @media (max-width: 520px), (pointer: coarse), (display-mode: standalone) {
    html, body, .stage, .frame-slot, .device, .device iframe {
      width: 100%;
      height: var(--preview-height);
      min-height: 0;
      max-height: none;
    }
    html, body {
      overflow: hidden;
    }
    .stage, .device {
      padding: 0;
    }
    .stage {
      display: block;
    }
    .brand, .hint {
      display: none;
    }
    .device {
      border-radius: 0;
      box-shadow: none;
      transform: none;
    }
    .device iframe {
      border-radius: 0;
    }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="brand">PATHWAY · PHONE PREVIEW</div>
    <div class="frame-slot" id="slot">
      <div class="device">
        <iframe src="./index.html" title="Pathway — clickable prototype (phone preview)" allow="fullscreen"></iframe>
      </div>
    </div>
    <p class="hint">Podgląd na komputerze w ramce 390×844 · <a href="./index.html">otwórz na pełnym ekranie</a></p>
  </main>
<script>
  (function () {
    var fit = function () {
      var available = window.innerHeight - 120;
      var scale = Math.min(1, Math.max(0.4, available / 864));
      document.documentElement.style.setProperty("--s", scale);
    };
    fit();
    window.addEventListener("resize", fit);
  })();
</script>
</body>
</html>
