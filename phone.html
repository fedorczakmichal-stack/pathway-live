<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathway — phone preview</title>
<style>
  html, body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(120% 120% at 50% 0%, #123a30 0%, #0b2922 45%, #051a16 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #f1e6d4;
  }
  .stage {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 16px;
    box-sizing: border-box;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    letter-spacing: 0.18em;
    font-weight: 700;
    font-size: 12.5px;
    color: #e5cd9c;
  }
  /* Ramka trzyma STAŁE 390x844 (apka jest projektowana na ten viewport)
     i jest tylko skalowana do okna — nigdy ściskana. */
  .frame-slot {
    width: calc(410px * var(--s, 1));
    height: calc(864px * var(--s, 1));
  }
  .device {
    width: 410px;
    height: 864px;
    padding: 10px;
    border-radius: 44px;
    background: #0a0f0d;
    box-shadow:
      0 0 0 1px rgba(228, 207, 152, 0.22),
      0 30px 80px rgba(0, 0, 0, 0.55);
    box-sizing: border-box;
    transform: scale(var(--s, 1));
    transform-origin: top left;
  }
  .device iframe {
    width: 390px;
    height: 844px;
    border: 0;
    border-radius: 34px;
    background: #071d18;
    display: block;
  }
  .hint { font-size: 12.5px; opacity: 0.75; margin: 0; text-align: center; }
  .hint a { color: #e5cd9c; }
  /* Na prawdziwym telefonie ramka nie ma sensu — pełny ekran */
  @media (max-width: 520px) {
    .stage { padding: 0; gap: 0; }
    .brand, .hint { display: none; }
    .frame-slot { width: 100vw; height: 100dvh; }
    .device {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
      transform: none;
    }
    .device iframe { width: 100%; height: 100%; border-radius: 0; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">PATHWAY · PHONE PREVIEW</div>
    <div class="frame-slot" id="slot">
      <div class="device" id="device">
        <iframe src="./index.html" title="Pathway — clickable prototype (phone preview)" allow="fullscreen"></iframe>
      </div>
    </div>
    <p class="hint">Podgląd na komputerze w ramce 390×844 · <a href="./index.html">otwórz na pełnym ekranie</a></p>
  </div>
<script>
  (function () {
    // Telefon: ramka-w-ramce gubi safe-area (iOS nie przekazuje env() do
    // iframe) — otwieramy pelna apke bezposrednio.
    // 2026-07-29: przekierowanie po DOTYKU, nie po szerokości. Telefon w
    // trybie "Request Desktop Website" ma viewport ~980 px, więc warunek
    // szerokości nie odpalał i uzytkownik ogladal apke w narysowanej ramce
    // telefonu zamiast na pelnym ekranie. ?frame=1 zostawia ramke na sile.
    var touch = (navigator.maxTouchPoints || 0) > 0
      || window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    var narrow = window.matchMedia('(max-width: 520px)').matches;
    if (!/[?&]frame=1\b/.test(location.search) && (touch || narrow)) {
      window.location.replace('./index.html' + location.hash);
      return;
    }
    var fit = function () {
      if (window.matchMedia('(max-width: 520px)').matches) {
        document.documentElement.style.setProperty('--s', 1);
        return;
      }
      var available = window.innerHeight - 120;
      var scale = Math.min(1, Math.max(0.4, available / 864));
      document.documentElement.style.setProperty('--s', scale);
    };
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
